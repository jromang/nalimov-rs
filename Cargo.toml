description = "Zero-dependency Nalimov endgame tablebase prober — pure Rust, 3–6 pieces, thread-safe"
license = "MIT"
repository = "https://github.com/jromang/nalimov-rs"
keywords = ["chess", "endgame", "tablebase", "nalimov"]
